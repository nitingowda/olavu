<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
body{
    margin:0;
    font-family: 'Georgia', serif;
    background: linear-gradient(to bottom, #1a1a1a, #3a3a3a);
    color:white;
    text-align:center;
}

h1{
    margin-top:25px;
    font-size:30px;
}

.message{
    margin:10px 20px;
    font-size:18px;
    line-height:1.6;
}

/* slideshow */
.slideshow{
    position:relative;
    width:95%;
    height:65vh;
    margin:20px auto;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;   /* FULL SCREEN */
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* buttons */
.controls{
    margin-top:10px;
}

button{
    padding:10px 18px;
    font-size:16px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:white;
    color:#333;
}
</style>
</head>

<body>

<h1>Happy Valentine's Day My Love ❤️</h1>

<div class="message">
ನಿನ್ನ ಕಂಗಳ ನೋಟದಲಿ<br>
ಬೆಳಗುತಿದೆ ಎನ್ನುಸಿರೆಂಬ ದೀವಿಗೆ<br>
ಆರದದು ಎಂದಿಗೂ,<br>
ನಿನ್ನೊಲವೆಂಬ ಸುದೆಯ ಎರಕವಿರಲು ❤️
</div>

<div class="slideshow">
    <img class="slide active" src="silout.jpg">
    <img class="slide" src="proposal.jpg">
    <img class="slide" src="jump.jpg">
    <img class="slide" src="pair.jpg">
    <img class="slide" src="snow.jpg">
    <img class="slide" src="piono.jpg">
    <img class="slide" src="maduve.jpg">
</div>

<div class="controls">
    <button onclick="pauseSlides()">Pause ⏸️</button>
    <button onclick="startSlides()">Play ▶️</button>
</div>

<audio id="bgMusic">
    <source src="olavu.mp3" type="audio/mpeg">
</audio>

<div style="margin-top:10px;">
    <button onclick="playMusic()">Play Our Song 🎵</button>
</div>

<script>
window.onload = function(){

    const slides = document.querySelectorAll(".slide");
    let index = 0;
    let interval;

    function nextSlide(){
        slides[index].classList.remove("active");
        index = (index + 1) % slides.length;
        slides[index].classList.add("active");
    }

    function start(){
        if(interval) clearInterval(interval);
        interval = setInterval(nextSlide, 3000);
    }

    start();

    window.pauseSlides = function(){
        clearInterval(interval);
    }

    window.startSlides = function(){
        start();
    }

    window.playMusic = function(){
        const music = document.getElementById("bgMusic");
        music.volume = 1;
        music.muted = false;

        music.play().catch(()=>{
            alert("If music didn’t start, tap again ❤️");
        });
    }
}
</script>

</body>
</html>
