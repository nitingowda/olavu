<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    text-align:center;
    background: linear-gradient(to bottom right,#ff758c,#ff7eb3);
    color:white;
}

h1{
    margin-top:40px;
    font-size:40px;
}

.message{
    margin:20px;
    font-size:20px;
}

.gallery{
    margin-top:30px;
}

.gallery img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:15px;
    margin:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

button{
    padding:12px 20px;
    font-size:18px;
    background:white;
    color:#ff4d6d;
    border:none;
    border-radius:10px;
    margin-top:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Happy Valentine's Day My Love ❤️</h1>

<div class="message">
    From the day we married, my life became beautiful.<br>
    Every moment with you is special.<br>
    I love you forever ❤️
</div>

<button onclick="playMusic()">Play Our Song 🎵</button>

<div class="gallery">
    <!-- CHANGE YOUR PHOTOS HERE -->
    <img src="silout.jpg">
    <img src="propose.jpg">
    <img src="jump.jpg">
</div>

<audio id="bgMusic">
    <!-- PUT YOUR SONG FILE NAME -->
    <source src="usiru.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic(){
    document.getElementById("bgMusic").play();
}
</script>

</body>
</html>
