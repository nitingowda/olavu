<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
body{
    margin:0;
    font-family: Georgia, serif;
    background: linear-gradient(to bottom, #1a1a1a, #3a3a3a);
    color:white;
    text-align:center;
}

h1{
    margin-top:25px;
    font-size:30px;
}

.message{
    margin:10px 20px;
    font-size:18px;
    line-height:1.6;
}

.slideshow{
    position:relative;
    width:95%;
    height:60vh;
    margin:20px auto;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
}

.slide.active{
    opacity:1;
}

button{
    padding:10px 18px;
    font-size:16px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:white;
    color:#333;
}
</style>
</head>

<body>

<h1>Happy Valentine's Day My Love ❤️</h1>

<div class="message">
ನಿನ್ನ ಕಂಗಳ ನೋಟದಲಿ<br>
ಬೆಳಗುತಿದೆ ಎನ್ನುಸಿರೆಂಬ ದೀವಿಗೆ<br>
ಆರದದು ಎಂದಿಗೂ,<br>
ನಿನ್ನೊಲವೆಂಬ ಸುದೆಯ ಎರಕವಿರಲು ❤️
</div>

<div class="slideshow">
    <img class="slide active" src="silout.jpg">
    <img class="slide" src="proposal.jpg">
    <img class="slide" src="jump.jpg">
    <img class="slide" src="pair.jpg">
    <img class="slide" src="snow.jpg">
    <img class="slide" src="piono.jpg">
    <img class="slide" src="maduve.jpg">
</div>

<div>
    <button onclick="pauseSlides()">Pause ⏸️</button>
    <button onclick="startSlides()">Play ▶️</button>
</div>

<audio id="bgMusic">
    <source src="olavu.mp3" type="audio/mpeg">
</audio>

<div>
    <button onclick="playMusic()">Play Our Song 🎵</button>
</div>

<script>
var slides = document.getElementsByClassName("slide");
var index = 0;
var interval = setInterval(nextSlide, 3000);

function nextSlide(){
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}

function pauseSlides(){
    clearInterval(interval);
}

function startSlides(){
    clearInterval(interval);
    interval = setInterval(nextSlide, 3000);
}

function playMusic(){
    var music = document.getElementById("bgMusic");
    music.play();
}
</script>

</body>
</html>
